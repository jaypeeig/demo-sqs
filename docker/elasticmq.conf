include classpath("application.conf")

// "*" makes ElasticMQ generate queue URLs from whatever host/port the client
// used to connect, so http://localhost:9324/... works from the host and
// http://sqs:9324/... would work from another container on the same network.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

// Pre-declare the demo queue (and its DLQ) so it exists the moment the
// container is healthy - no separate "create queue" step needed locally.
queues {
  DemoQueue {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 5 seconds
    messageRetentionPeriod = 3 days
    deadLettersQueue {
      name = "DemoQueue-dlq"
      maxReceiveCount = 3
    }
  }
  DemoQueue-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
